// Material helpers
function lam(c,op,em){
  const m=new THREE.MeshLambertMaterial({color:c});
  if(op!==undefined){m.transparent=true;m.opacity=op;}
  if(em!==undefined) m.emissive=new THREE.Color(em);
  return m;
}
const M={
  floor:lam(0xb0b8c4), fl:lam(0x8890a0), wall:lam(0xc0c8d0,0.40),
  col:lam(0x7a8290), sd:lam(0x40454e), sm:lam(0x5e646e), sl:lam(0x8a9098),
  bp:lam(0x1e3258), scg:lam(0x0a9050,undefined,0x042818),
  org:lam(0xc84008), yel:lam(0xf0c008),
  ais:lam(0xf0c010,0.78), zL:lam(0x70c8b8,0.15), zR:lam(0x7090d0,0.15),
  rack:lam(0x705830), pal:lam(0x907040),
  g1:lam(0x9a6830), g2:lam(0x2a5898), g3:lam(0x702898), g4:lam(0x289050),

function stMat(s){return lam({ON:0x22c55e,OFF:0xef4444,MAINTENANCE:0xf59e0b}[s]||0x888888,
  undefined,{ON:0x0a4020,OFF:0x3a0808,MAINTENANCE:0x3a2000}[s]||0);}

// Geometry builders
function B(w,h,d,mat,x,y,z,rx=0,ry=0,rz=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.rotation.set(rx,ry,rz);
  m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function C(rt,rb,h,seg,mat,x,y,z,rx=0,rz=0){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
  m.position.set(x,y,z);m.rotation.set(rx,0,rz);m.castShadow=true;scene.add(m);return m;
}
function Sp(r,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),mat);
  m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m;
}
function armSeg(pts,mat,r=0.17){
  for(let i=0;i<pts.length-1;i++){
    const a=new THREE.Vector3(...pts[i]),b=new THREE.Vector3(...pts[i+1]);
    const mid=a.clone().lerp(b,.5),len=a.distanceTo(b);
    const sg=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8),mat);
    sg.position.copy(mid);sg.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());
    sg.castShadow=true;scene.add(sg);
  }
}
function stLight(x,y,z,st){
  Sp(0.23,stMat(st),x,y,z);
  const pl=new THREE.PointLight({ON:0x22c55e,OFF:0xef4444,MAINTENANCE:0xf59e0b}[st]||0x888888,st==='ON'?0.75:0.15,3.5);
  pl.position.set(x,y,z);scene.add(pl);
}
function makeLbl(text,x,y,z,w=4.5){
  const cv2=document.createElement('canvas');cv2.width=256;cv2.height=44;
  const ctx=cv2.getContext('2d');
  ctx.fillStyle='rgba(6,10,20,0.86)';ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(2,2,252,40,7);else ctx.rect(2,2,252,40);
  ctx.fill();
  ctx.font='bold 15px monospace';ctx.fillStyle='#b0c8e8';ctx.textAlign='center';
  const t=text.length>22?text.slice(0,21)+'..':text;ctx.fillText(t,128,27);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv2),transparent:true}));
  sp.position.set(x,y,z);sp.scale.set(w,0.77,1);scene.add(sp);
}

// -- BUILD ALL MACHINES + WORKERS ---------------------------------------------
const pickMeshes=[];
LAYOUT.forEach(slot=>{
  // Find matching machine from data (exact name or prefix match with trailing spaces/numbers)
  const mdata=MACHINES.find(m=>m.name.trim()===slot.n.trim())
    ||MACHINES.find(m=>m.name.trim().replace(/\s*\d+$/,'')===slot.n.trim().replace(/\s*\d+$/,''));
  const isZone = slot.zone===true || (mdata && mdata.status==='-');
  const st=isZone?'ZONE':(mdata?mdata.status:'ON');
  const ops=isZone?0:(mdata?mdata.operators:1);

  // Build machine geometry -- zone entries use a lighter/muted appearance
  if(isZone){
    // Draw a flat storage/zone platform instead of a machine
    B(6,0.3,5,M.sm,slot.x,0.15,slot.z);            // floor platform
    B(5.8,0.08,4.8,M.zL,slot.x,0.32,slot.z);        // zone overlay
    B(0.2,2.0,5,M.col,slot.x-2.8,1.0,slot.z);       // shelf upright L
    B(0.2,2.0,5,M.col,slot.x+2.8,1.0,slot.z);       // shelf upright R
    B(5.8,0.15,4.8,M.rack,slot.x,1.5,slot.z);        // shelf
    // No status light -- zone entries don't have machine lights
  } else {
    slot.fn(slot.x,slot.z,st);
  }

  // Label (zone entries shown slightly faded)
  makeLbl(slot.n,slot.x,10.2,slot.z, isZone?3.8:4.5);

  // Invisible pick target for tooltip
  const ph=new THREE.Mesh(new THREE.BoxGeometry(5.5,9,5.5),
    new THREE.MeshBasicMaterial({transparent:true,opacity:0}));
  ph.position.set(slot.x,4.5,slot.z);ph.userData={n:slot.n,mdata,isZone};
  scene.add(ph);pickMeshes.push(ph);

  // Place workers only for active machines (not zone/storage entries)
  if(!isZone){
    const wCount=Math.min(ops,5);
    for(let w=0;w<wCount;w++){
      const off=WOS[w];
      mkWorker(slot.x+off[0],0.3,slot.z+off[2]);
    }
  }
});

// -- CAMERA -------------------------------------------------------------------
const ctr=new THREE.Vector3(30,4,SZ/2);
let theta=0.45,phi=0.52,radius=95;

const VIEWS={
  overview:()=>{theta=0.45;phi=0.52;radius=95;ctr.set(30,4,SZ/2);},
  entrance:()=>{theta=0.0; phi=0.45;radius=75;ctr.set(30,3,SZ-8);},
  right:   ()=>{theta=0.2; phi=0.50;radius=60;ctr.set(12,4,SZ/2);},
  left:    ()=>{theta=-0.2;phi=0.50;radius=60;ctr.set(45,4,SZ/2);},
  top:     ()=>{theta=0.01;phi=1.52;radius=90;ctr.set(30,0,SZ/2);},
};
window.setView=n=>{if(VIEWS[n])VIEWS[n]();};

let drag=false,lmx=0,lmy=0;
const cv=document.getElementById('c');
cv.addEventListener('mousedown',e=>{drag=true;lmx=e.clientX;lmy=e.clientY;});
cv.addEventListener('mouseup',()=>drag=false);

const mouse2=new THREE.Vector2();
cv.addEventListener('mousemove',e=>{
  if(drag){theta+=(e.clientX-lmx)*0.006;phi-=(e.clientY-lmy)*0.005;phi=Math.max(.1,Math.min(1.55,phi));}
  lmx=e.clientX;lmy=e.clientY;
  mouse2.x=(e.clientX/innerWidth)*2-1;mouse2.y=-(e.clientY/innerHeight)*2+1;
});
cv.addEventListener('wheel',e=>{radius=Math.max(22,Math.min(180,radius+e.deltaY*.18));},{passive:true});
let ts=null;
cv.addEventListener('touchstart',e=>{if(e.touches.length===1)ts={x:e.touches[0].clientX,y:e.touches[0].clientY};});
cv.addEventListener('touchmove',e=>{
  if(!ts||e.touches.length!==1)return;
  theta+=(e.touches[0].clientX-ts.x)*0.006;phi-=(e.touches[0].clientY-ts.y)*0.005;
  phi=Math.max(.1,Math.min(1.55,phi));ts={x:e.touches[0].clientX,y:e.touches[0].clientY};
});

// Tooltip
const ray2=new THREE.Raycaster(),tt=document.getElementById('tt');
let lastHit=null;
cv.addEventListener('mousemove',()=>{
  ray2.setFromCamera(mouse2,cam);
  const hits=ray2.intersectObjects(pickMeshes);
  if(hits.length){
    const d=hits[0].object.userData;
    if(d.n!==lastHit){
      lastHit=d.n;
      if(d.isZone){
        tt.innerHTML=`<b style="color:#94a3b8">${d.n}</b><br><span style="color:#64748b">Zone / Storage Area</span><br>No machine status`;
      } else {
        const m=d.mdata;
        if(m){
          const sc={ON:'#22c55e',OFF:'#ef4444',MAINTENANCE:'#f59e0b'}[m.status]||'#888';
          tt.innerHTML=`<b style="color:#e2e8f0">${m.name}</b><br>Status: <b style="color:${sc}">${m.status}</b><br>Zone: ${m.zone}<br>Operators: ${m.operators}`;
        } else {
          tt.innerHTML=`<b style="color:#e2e8f0">${d.n}</b>`;
        }
      }
    }
    tt.style.display='block';
    const ev=window.event;if(ev){tt.style.left=(ev.clientX+14)+'px';tt.style.top=(ev.clientY-8)+'px';}
  } else {tt.style.display='none';lastHit=null;}
});

const areaLabels={'F5_A1':'AREA 1','F5_A2':'AREA 2','F4_A1':'AREA 1','F4_A2':'AREA 2'};

document.getElementById('factoryTitle').textContent=factoryLabels[AREA_KEY]||'FACTORY';

// -- RENDER LOOP ---------------------------------------------------------------
function animate(){
  requestAnimationFrame(animate);
  const cx=ctr.x+radius*Math.sin(phi)*Math.cos(theta);
  const cy=ctr.y+radius*Math.cos(phi);
  const cz=ctr.z+radius*Math.sin(phi)*Math.sin(theta);
  cam.position.set(cx,cy,cz);cam.lookAt(ctr);
  renderer.render(scene,cam);
}
animate();
window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
});
